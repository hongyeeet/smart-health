<rect x="30" y="1002" width="510" height="62" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="42" y="1022" font-size="14" font-weight="500" fill="#633806">Vertex AI: Gemini 3.8 Flash</text>
<text x="42" y="1042" font-size="12" fill="#854F0B">reads meal photos and logs the calories and macros, words the</text>
<text x="42" y="1058" font-size="12" fill="#854F0B">nudges from the evidence packet. Daily call and budget cap.</text>
<rect x="570" y="1002" width="510" height="62" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="582" y="1022" font-size="14" font-weight="500" fill="#633806">Singapore food dataset (CSV, 2,689 rows, per serving)</text>
<text x="582" y="1042" font-size="12" fill="#854F0B">a shelf of lighter dishes for the NEXT meal; never sets logged</text>
<text x="582" y="1058" font-size="12" fill="#854F0B">numbers. Searched only by the Swap ranker (code + JEV check).</text>
